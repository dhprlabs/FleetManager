# ============================================================
# STATIC TF
# ============================================================
# Removed: the global /tf_static bridge from Gazebo uses VOLATILE
# QoS, but tf2_ros subscribers require TRANSIENT_LOCAL.  This
# mismatch causes "incompatible QoS DURABILITY" warnings and the
# static transforms are silently dropped.
# robot_state_publisher already publishes all URDF static TFs
# with correct TRANSIENT_LOCAL QoS, so this bridge is not needed.
